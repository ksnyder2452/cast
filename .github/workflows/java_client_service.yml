# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java Client Service

on:
  push:
    branches: [ "main" ]
    paths: [ "CAST_Java_Client_Service/**" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define the matrix variable 'java-version' with a list of versions
        java-version: [ '17' ] 
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: mvn test --file pom.xml
      working-directory: ./CAST_Java_Client_Service
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: surefire-reports-{{ github.job }}
        path: ./CAST_Java_Client_Service/target/surefire-reports/**/*.xml
