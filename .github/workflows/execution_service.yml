# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
    paths: [ "./Execution_Service/**" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define the matrix variable 'dotnet-version' with a list of versions
        dotnet-version: [ '9.0.x' ] 

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies for Execution Service
      run: dotnet restore
    - name: Build Execution Service
      run: dotnet build --no-restore
    - name: Test Execution Service
      run: dotnet test --verbosity normal --logger trx --results-directory "TestResults-${{ matrix.dotnet-version }}"
      working-directory: ./Tests
    - name: Upload Execution Service test results
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        # name: dotnet-results-${{ matrix.dotnet-version }}
        name: execution_service-results
        path: ./Tests/TestResults-${{ matrix.dotnet-version }}
